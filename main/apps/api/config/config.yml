server:
  host: "0.0.0.0"
  http_port: "8080"
  socket_port: "7000"
  mode: "release"

logger:
  level:  "debug"
  format: "json"

psql_db:
  type:    "postgres"
  host:    "psql_db"
  port:    "5432"
  dbname:  "infralyra_db"
  sslmode: "disable"

redis_db:
  host: "redis_db"
  port: "6379"
  db: 0

auth:
  access_token_ttl: "15m"
  refresh_token_ttl: "168h"
  rate_limit_count: 100000
  rate_limit_ttl: "1m"
  sock_room_ttl: "8h"

interfaces:
  save_ttl: "6h"

cron:
  net_scan_ttl: "10m"
