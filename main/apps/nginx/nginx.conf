events {
    worker_connections 1024;
}

http {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;

    server {
        listen 80;
        listen [::]:80;
        server_name _;

        location /api/ {
            proxy_read_timeout 1m;
            proxy_connect_timeout 1m;
            proxy_send_timeout 1m;

            add_header Access-Control-Allow-Origin $http_origin always;
            add_header Access-Control-Allow-Credentials true always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, PATCH, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Origin, X-Requested-With, Content-Type, Accept, Cookie" always;

            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin $http_origin always;
                add_header Access-Control-Allow-Credentials true always;
                add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, PATCH, OPTIONS" always;
                add_header Access-Control-Allow-Headers "Authorization, Origin, X-Requested-With, Content-Type, Accept, Cookie" always;
                add_header Content-Length 0;
                add_header Content-Type text/plain;
                return 204;
            }

            proxy_pass http://api:8080/;
        }

        location /socket.io/ {
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header Origin $http_origin;  # ← Важно!
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            proxy_read_timeout 3600s;
            proxy_connect_timeout 60s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
            proxy_cache off;
            
            add_header Access-Control-Allow-Origin $http_origin always;
            add_header Access-Control-Allow-Credentials true always;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept" always;
            
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin $http_origin always;
                add_header Access-Control-Allow-Credentials true always;
                add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
                add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept" always;
                add_header Content-Length 0;
                add_header Content-Type text/plain;
                return 204;
            }
            
            proxy_pass http://api:7000/socket.io/;
        }

        location /ws/ {
            proxy_pass http://client:4174/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        location ~* \.(js|css|png|jpg|jpeg|webm|gif|mp3|mp4|ogg|ico|svg|woff|woff2|eot|ttf|otf|map|webp|avif|json|xml|wasm)$ {
            proxy_read_timeout 1m;
            proxy_connect_timeout 1m;
            proxy_send_timeout 1m;

            expires 1y;
            add_header Cache-Control "public, immutable";
            proxy_pass http://client:4174/;
        }

        location / {
            proxy_read_timeout 1m;
            proxy_connect_timeout 1m;

            rewrite ^ / break;
            proxy_pass http://client:4174/;
        }

        error_page 404 /errors/404.html;
        error_page 500 502 503 504 /errors/500.html;

        location ^~ /errors/ {
            internal;
            root /usr/share/nginx/html;
        }
    }
}
